<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" role="img" aria-labelledby="title description">
  <title id="title">CYBORG-YASHRAJ GitHub statistics</title>
  <desc id="description">{{CONTRIBUTIONS}} contributions in the last year, {{REPOS}} public repositories including {{ORIGINAL}} original projects, {{STARS}} stars across repositories, and {{FOLLOWERS}} followers. A 52-week contribution heatmap, language breakdown, and monthly activity chart follow. Updated {{UPDATED}}.</desc>
  <style>
    :root{--bg:#0d1117;--panel:#141b24;--line:#293644;--ink:#e6edf3;--muted:#9baebb;--accent:#67d8ef}
    text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.mono{font-family:Consolas,monospace}.small{font-size:12px}.tiny{font-size:10px}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}.panel{fill:var(--panel);stroke:var(--line)}.hairline{stroke:var(--line);stroke-width:1}
    .flow{stroke:var(--accent);stroke-width:2;stroke-dasharray:8 180;animation:flow 6s linear infinite}@keyframes flow{to{stroke-dashoffset:-188}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect x="1" y="1" width="958" height="778" rx="16" fill="var(--bg)" stroke="var(--line)"/>
  <text class="mono accent" x="34" y="42" font-size="13" letter-spacing="2">CYBORG-YASHRAJ / GITHUB REPORT</text>
  <text x="34" y="90" font-size="34" font-weight="700" letter-spacing="-1.2">A year of building in public.</text>
  <text class="mono muted" x="36" y="113" font-size="11">LIVE PUBLIC DATA · REFRESHED {{UPDATED}}</text>
  <path class="hairline" d="M744 25H922"/><path class="flow" d="M744 25H922"/>
  <rect class="panel" x="28" y="132" width="213" height="111" rx="10"/>
  <rect class="panel" x="250" y="132" width="213" height="111" rx="10"/>
  <rect class="panel" x="472" y="132" width="213" height="111" rx="10"/>
  <rect class="panel" x="694" y="132" width="238" height="111" rx="10"/>
  <text class="mono muted" x="45" y="157" font-size="11">LAST 12 MONTHS</text>
  <text class="mono muted" x="267" y="157" font-size="11">PUBLIC REPOSITORIES</text>
  <text class="mono muted" x="489" y="157" font-size="11">STARS EARNED</text>
  <text class="mono muted" x="711" y="157" font-size="11">FOLLOWERS</text>
  <text class="accent" x="43" y="209" font-size="48" font-weight="700">{{CONTRIBUTIONS}}</text>
  <text class="accent" x="265" y="209" font-size="48" font-weight="700">{{REPOS}}</text>
  <text class="accent" x="487" y="209" font-size="48" font-weight="700">{{STARS}}</text>
  <text class="accent" x="709" y="209" font-size="48" font-weight="700">{{FOLLOWERS}}</text>
  <text class="muted" x="267" y="229" font-size="11">{{ORIGINAL}} original projects</text>
  <rect class="panel" x="28" y="255" width="904" height="226" rx="10"/>
  <text x="47" y="288" font-size="17" font-weight="600">Contribution calendar</text>
  <text class="muted" x="912" y="287" font-size="11" text-anchor="end">SUNDAY → SATURDAY · PAST YEAR</text>
  <text x="30" y="341" class="tiny muted">S</text><text x="30" y="389" class="tiny muted">W</text><text x="30" y="437" class="tiny muted">S</text>
  {{HEATMAP}}
  {{MONTH_LABELS}}
  <rect class="panel" x="28" y="494" width="437" height="256" rx="10"/>
  <rect class="panel" x="478" y="494" width="454" height="256" rx="10"/>
  <text x="47" y="528" font-size="17" font-weight="600">Languages by original repo</text>
  <text class="muted" x="48" y="550" font-size="11">PRIMARY LANGUAGE · TOP FIVE</text>
  {{LANGUAGE_BARS}}
  <text x="497" y="528" font-size="17" font-weight="600">Contribution rhythm</text>
  <text class="muted" x="498" y="550" font-size="11">CONTRIBUTIONS BY MONTH · LAST 12 MONTHS</text>
  <path class="hairline" d="M510 711H910"/>
  {{MONTH_BARS}}
  <text class="mono muted" x="32" y="771" font-size="10">SOURCE: GITHUB PUBLIC PROFILE, API AND CONTRIBUTION CALENDAR</text>
</svg>
