name: Refresh GitHub stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GitHub stats report
        run: python3 scripts/update_github_stats.py
      - name: Commit refreshed report
        run: |
          git add assets/github-stats.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh GitHub stats report"
          git push
