<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Yashraj Pahuja — AI and full-stack engineer</title>
  <desc id="desc">Connecting models, software, and the physical world. An animated circuit carries signals between three nodes.</desc>
  <style>
    :root{--bg:#0d1117;--ink:#f0f6fc;--muted:#a3b1bf;--line:#293644;--accent:#67d8ef}
    .bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.accent{fill:var(--accent)}
    text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:2px}
    .wire{fill:none;stroke:var(--line);stroke-width:1.5}.signal{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:10 390;animation:flow 7s linear infinite}
    .node{fill:var(--bg);stroke:var(--accent);stroke-width:2}.cursor{animation:blink 2s steps(2,end) infinite}.enter{animation:enter .8s ease-out both}
    @keyframes flow{to{stroke-dashoffset:-400}}@keyframes blink{50%{opacity:0}}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.signal,.cursor,.enter{animation:none}.signal{stroke-dasharray:none;opacity:.45}}
  </style>
  <rect class="bg" width="960" height="340" rx="16"/>
  <path class="wire" d="M40 32H920M40 308H920"/>
  <g class="enter">
    <text class="mono accent" x="48" y="70" font-size="12">CYBORG-YASHRAJ / ENGINEERING</text>
    <text class="ink" x="44" y="144" font-size="64" font-weight="700" letter-spacing="-2.5">Yashraj Pahuja<tspan class="cursor accent">_</tspan></text>
    <text class="muted" x="48" y="181" font-size="21">Connecting models, software, and the physical world.</text>
  </g>
  <path class="wire" d="M56 254H420L450 224H650L680 254H902"/>
  <path class="signal" d="M56 254H420L450 224H650L680 254H902"/>
  <g class="node">
    <circle cx="56" cy="254" r="5"/><circle cx="480" cy="224" r="5"/><circle cx="902" cy="254" r="5"/>
  </g>
  <g class="mono muted" font-size="11">
    <text x="48" y="286">01 / APPLIED AI</text>
    <text x="448" y="286">02 / FULL STACK</text>
    <text x="762" y="286">03 / EMBEDDED</text>
  </g>
</svg>
