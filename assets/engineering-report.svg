<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
  <title id="title">Yashraj Pahuja — engineering report</title>
  <desc id="desc">Selected outcomes: 85 percent or better EEG classification across more than 10,000 samples; 35 percent less editorial time for more than 100 faculty; 30 percent faster website load time; three hackathon awards. Contact yashraj9.contact@gmail.com.</desc>
  <style>
    :root{--bg:#0d1117;--panel:#141b24;--line:#293644;--ink:#e6edf3;--muted:#a3b1bf;--accent:#67d8ef}
    text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.mono{font-family:Consolas,monospace}.muted{fill:var(--muted)}.accent{fill:var(--accent)}
    .panel{fill:var(--panel);stroke:var(--line)}.hairline{stroke:var(--line);stroke-width:1}.track{fill:none;stroke:#253642;stroke-width:8}.arc{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;stroke-dasharray:187 220;transform:rotate(-90deg);transform-origin:761px 253px}
    .pulse{animation:pulse 5s ease-in-out infinite}.flow{stroke:var(--accent);stroke-width:2;stroke-dasharray:8 180;animation:flow 6s linear infinite}
    @keyframes pulse{50%{opacity:.45}}@keyframes flow{to{stroke-dashoffset:-188}}@media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
  </style>
  <rect x="1" y="1" width="958" height="488" rx="16" fill="var(--bg)" stroke="var(--line)"/>
  <text class="mono accent" x="36" y="47" font-size="14" letter-spacing="2">FIELD NOTES / ENGINEERING REPORT</text>
  <text x="36" y="99" font-size="38" font-weight="700" letter-spacing="-1.4">Evidence in the work.</text>
  <text class="muted" x="38" y="126" font-size="16">Research, product engineering, and community outcomes.</text>
  <rect class="panel" x="28" y="148" width="570" height="212" rx="12"/>
  <text class="mono accent" x="50" y="181" font-size="12" letter-spacing="1.5">01 / EEG RESEARCH</text>
  <text x="48" y="266" font-size="76" font-weight="700" letter-spacing="-3">85%<tspan font-size="38">+</tspan></text>
  <text class="muted" x="52" y="297" font-size="16">classification accuracy on SEED-IV</text>
  <path class="hairline" d="M50 320H576"/>
  <text class="mono muted" x="52" y="343" font-size="12">10,000+ SIGNAL SAMPLES  /  20+ FEATURES</text>
  <rect class="panel" x="610" y="148" width="322" height="212" rx="12"/>
  <text class="mono accent" x="634" y="181" font-size="12" letter-spacing="1.5">SIGNAL / ACCURACY</text>
  <circle class="track" cx="761" cy="253" r="35"/>
  <circle class="arc" cx="761" cy="253" r="35"/>
  <text x="761" y="261" text-anchor="middle" font-size="19" font-weight="700">85</text>
  <text class="muted" x="761" y="333" text-anchor="middle" font-size="13">PYTORCH · EEG · SEED-IV</text>
  <rect class="panel" x="28" y="372" width="290" height="86" rx="10"/>
  <rect class="panel" x="334" y="372" width="290" height="86" rx="10"/>
  <rect class="panel" x="640" y="372" width="292" height="86" rx="10"/>
  <text class="accent" x="46" y="416" font-size="32" font-weight="700">35%</text>
  <text class="muted" x="46" y="440" font-size="12">LESS EDITORIAL TIME · 100+ FACULTY</text>
  <text class="accent" x="352" y="416" font-size="32" font-weight="700">30%</text>
  <text class="muted" x="352" y="440" font-size="12">FASTER WEBSITE LOAD TIME</text>
  <text class="accent" x="658" y="416" font-size="32" font-weight="700">03</text>
  <text class="muted" x="658" y="440" font-size="12">HACKATHON AWARDS</text>
  <path class="hairline" d="M744 21H922"/><path class="flow" d="M744 21H922"/>
  <circle class="pulse" cx="920" cy="21" r="4" fill="var(--accent)"/>
</svg>
